name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first: the older run's answer is already stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # No secrets, still. Every test runs against either an injected fake or the throwaway Postgres
    # below — never a real credential. A test that needs one has stopped being a test CI can run.
    #
    # The database service is not here to make the unit tests heavier. It is here because on
    # 2026-09-14 two functions were found that had NEVER worked — `expireImpersonations` and the
    # shared rate-limit counter — while 518 tests were green, because nothing in the suite ever
    # spoke to a real Postgres. A `Date` inside a raw `sql` template reaches the driver without the
    # column's type mapper and arrives as text Postgres cannot parse. Only a real server says so.
    env:
      CI: 'true'
      INFRA_TEST_DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/infra_test'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: infra_test
        ports:
          - 5432:5432
        # Without the health check the first query races the server's startup and fails as if the
        # code were broken.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Applies 0000→latest to the throwaway database. Also a real check in its own right: a
      # migration that does not apply cleanly from empty fails here rather than in production.
      - name: Apply migrations to the test database
        run: INFRA_MASTER_DATABASE_URL="$INFRA_TEST_DATABASE_URL" pnpm db:migrate

      # Includes packages/db/tests/integration.test.ts, which skips itself when
      # INFRA_TEST_DATABASE_URL is unset — so this stays runnable on a laptop with no database.
      - name: Test
        run: pnpm test

      # Typecheck after build so it sees the emitted declaration files, the same order a local
      # `pnpm build && pnpm typecheck` uses.
      - name: Typecheck
        run: pnpm typecheck

      - name: Check for uncommitted migration drift
        run: |
          INFRA_MASTER_DATABASE_URL="postgresql://ci:ci@localhost:5432/ci" pnpm db:generate
          if [ -n "$(git status --porcelain packages/db/migrations)" ]; then
            echo "::error::schema changed but the migration was not committed — run pnpm db:generate"
            git --no-pager diff --stat packages/db/migrations
            exit 1
          fi
